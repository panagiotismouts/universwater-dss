[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dss-api-service"
version = "0.1.0"
description = "DSS external result API service"
requires-python = ">=3.11"
dependencies = [
    "dss_shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "motor>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "structlog>=24.1",
    "python-jose[cryptography]>=3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
