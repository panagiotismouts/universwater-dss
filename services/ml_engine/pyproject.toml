[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dss-ml-engine"
version = "0.1.0"
description = "DSS ML engine — training, prediction, XAI"
requires-python = ">=3.11"
dependencies = [
    "dss_shared",
    "apscheduler>=3.10",
    "motor>=3.3",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "shap>=0.45",
    "numpy>=1.26",
    "joblib>=1.3",
    "pydantic>=2.5",
    "structlog>=24.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
