[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dss-ingestion"
version = "0.1.0"
description = "DSS ingestion service — data pipeline worker"
requires-python = ">=3.11"
dependencies = [
    "dss_shared",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "motor>=3.3",
    "pydantic>=2.5",
    "structlog>=24.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
