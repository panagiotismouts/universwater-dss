services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      # Authentication. Operator must set both in .env (see config/.env.example).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME must be set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD must be set in .env}
    # MongoDB is reachable only on the internal docker network. The host port
    # mapping is intentionally NOT exposed. For local Compass access, run a
    # one-off container: `docker run --rm -it --network dss_default mongo:7.0 mongosh mongodb://<user>:<pw>@mongo:27017/?authSource=admin`

  # ── Ingestion service ──────────────────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DSS_MONGO_URI: ${DSS_MONGO_URI:?DSS_MONGO_URI must be set in .env}
      DSS_SERVICE_NAME: ingestion
      DSS_LOG_FORMAT: json
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro

  # ── ML engine ─────────────────────────────────────────────────────────────
  ml_engine:
    build:
      context: .
      dockerfile: services/ml_engine/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DSS_MONGO_URI: ${DSS_MONGO_URI:?DSS_MONGO_URI must be set in .env}
      DSS_SERVICE_NAME: ml_engine
      DSS_LOG_FORMAT: json
      DSS_MODEL_ARTIFACT_PATH: /app/artifacts
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - model_artifacts:/app/artifacts

  # ── API service ───────────────────────────────────────────────────────────
  api_service:
    build:
      context: .
      dockerfile: services/api_service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DSS_MONGO_URI: ${DSS_MONGO_URI:?DSS_MONGO_URI must be set in .env}
      DSS_SERVICE_NAME: api_service
      DSS_LOG_FORMAT: json
      DSS_API_HOST: 0.0.0.0
      DSS_API_PORT: "8000"
    depends_on:
      mongo:
        condition: service_healthy
    # api_service starts independently of ingestion/ml_engine (Amendment C.6).
    # Port 8000 is exposed for ssh-tunnel access from team members; do not
    # rely on this port being unreachable from outside the VM.
    ports:
      - "8000:8000"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo_data:
  model_artifacts:
